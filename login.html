<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Voice-to-Intent AI Assistant - Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen md:grid md:grid-cols-2 flex flex-col">

  <!-- LEFT PANEL -->
  <div class="relative overflow-hidden bg-gradient-to-br from-green-600 via-green-500 to-blue-400 text-white flex flex-col justify-center px-6 md:px-16 py-10 md:py-0">
    
    <!-- Animated circles -->
    <div class="absolute top-0 left-0 w-full h-full">
      <div class="absolute bg-white opacity-5 rounded-full w-52 h-52 -top-16 -left-16 animate-ping md:w-72 md:h-72"></div>
      <div class="absolute bg-white opacity-5 rounded-full w-40 h-40 -bottom-16 -right-16 animate-pulse md:w-56 md:h-56"></div>
    </div>

    <h1 class="text-4xl md:text-6xl lg:text-7xl font-extrabold mb-6 md:mb-10 bg-clip-text text-transparent bg-gradient-to-r from-green-300 to-green-100 leading-tight drop-shadow-lg">
      Voice-to-Intent  
      <br> AI Assistant
    </h1>

    <p class="text-sm md:text-lg text-green-100 max-w-md mb-6 md:mb-10">
      An intelligent system that converts natural user input into
      secure, optimized, and meaningful AI prompts.
    </p>

    <ul class="mt-4 space-y-2 text-green-100 list-disc list-inside text-sm md:text-base">
      <li>Intent Detection</li>
      <li>Prompt Optimization</li>
      <li>Security Validation</li>
    </ul>
  </div>

  <!-- RIGHT LOGIN PANEL -->
  <div class="flex items-center justify-center px-6 bg-gray-50">
    <div class="w-full max-w-md bg-white rounded-2xl p-10 shadow-2xl transition relative z-10">

      <h2 class="text-2xl font-semibold mb-2">
        Login
      </h2>
      <p class="text-gray-500 mb-6">
        Access your account
      </p>

      <form onsubmit="handleLogin(event)" class="space-y-5">

        <!-- Email -->
        <input
          type="email"
          id="email"
          placeholder="Email"
          required
          class="w-full p-3 rounded-lg border focus:ring-2 focus:ring-green-600 outline-none"
        />

        <!-- Password -->
        <input
          type="password"
          id="password"
          placeholder="Password"
          required
          class="w-full p-3 rounded-lg border focus:ring-2 focus:ring-green-600 outline-none"
        />

        <!-- Login Button -->
        <button
          type="submit"
          class="w-full bg-green-600 text-white py-3 rounded-lg font-medium hover:bg-green-700 transition"
        >
          Login
        </button>

      </form>

      <p class="text-center text-sm mt-6 text-gray-600">
        New user?
        <a href="signup.html" class="text-green-600 font-medium">
          Create account
        </a>
      </p>

    </div>
  </div>

  <script>
    function handleLogin(event) {
      event.preventDefault();

      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      if (!email || !password) {
        alert("Please enter email and password");
        return;
      }

      localStorage.setItem("user", JSON.stringify({ email }));
      window.location.href = "assistant.html";
    }
  </script>

</body>
</html>
