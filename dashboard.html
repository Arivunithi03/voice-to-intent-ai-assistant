<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>User Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gray-100 flex items-center justify-center">

  <div class="bg-white p-10 rounded-2xl shadow-2xl w-full max-w-md text-center">

    <h2 class="text-2xl font-bold mb-6 text-gray-800">
      User Dashboard
    </h2>

    <!-- Open Assistant Button -->
    <button 
      onclick="openAssistant()"
      class="w-full bg-green-600 text-white py-3 rounded-lg font-medium hover:bg-green-700 transition mb-4"
    >
      Open AI Assistant
    </button>

    <!-- Logout Button -->
    <button 
      onclick="logout()"
      class="w-full bg-red-500 text-white py-3 rounded-lg font-medium hover:bg-red-600 transition"
    >
      Logout
    </button>

  </div>

  <script>
    // Check if user is logged in
    const user = localStorage.getItem("user");

    if (!user) {
      window.location.href = "login.html";
    }

    function openAssistant() {
      window.location.href = "assistant.html";
    }

    function logout() {
      localStorage.removeItem("user");
      window.location.href = "login.html";
    }
  </script>

</body>
</html>
