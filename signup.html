<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Signup - Voice-to-Intent AI Assistant</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen relative flex flex-col md:grid md:grid-cols-2">

  <!-- LEFT BRANDING PANEL -->
  <div class="relative overflow-hidden bg-gradient-to-br from-green-600 via-green-500 to-blue-400 text-white flex flex-col justify-center px-6 md:px-16 py-10 md:py-0">

    <!-- Animated circles -->
    <div class="absolute top-0 left-0 w-full h-full">
      <div class="absolute bg-white opacity-5 rounded-full w-52 h-52 -top-16 -left-16 animate-ping md:w-72 md:h-72"></div>
      <div class="absolute bg-white opacity-5 rounded-full w-40 h-40 -bottom-16 -right-16 animate-pulse md:w-56 md:h-56"></div>
    </div>

    <!-- Big heading -->
    <h1 class="text-4xl md:text-6xl lg:text-7xl font-extrabold mb-6 md:mb-10 bg-clip-text text-transparent bg-gradient-to-r from-green-300 to-green-100 leading-tight drop-shadow-lg">
      Voice-to-Intent  
      <br> AI Assistant
    </h1>

    <p class="text-sm md:text-lg text-green-100 max-w-md mb-6 md:mb-10">
      An intelligent system that converts natural user input into
      secure, optimized, and meaningful AI prompts.
    </p>

    <ul class="mt-4 space-y-2 text-green-100 list-disc list-inside text-sm md:text-base">
      <li>Intent Detection</li>
      <li>Prompt Optimization</li>
      <li>Security Validation</li>
    </ul>

    <!-- Waveform animation -->
    <div class="mt-6 md:mt-10 flex gap-1">
      <script>
        for (let i = 0; i < 20; i++) {
          document.write(
            `<div class="w-1 h-4 md:h-5 bg-white rounded animate-bounce" style="animation-delay:${i * 0.1}s"></div>`
          );
        }
      </script>
    </div>
  </div>

  <!-- RIGHT SIDE (background for layout) -->
  <div class="hidden md:block bg-gray-50"></div>

  <!-- CENTERED SIGNUP CARD -->
  <div class="absolute inset-0 flex items-center justify-center px-6">
    <div class="relative w-full max-w-xl bg-white rounded-3xl p-16 shadow-2xl hover:shadow-3xl transition transform hover:scale-105 z-10 overflow-hidden">

      <!-- Subtle background pattern -->
      <div class="absolute inset-0">
        <img
          src="https://www.transparenttextures.com/patterns/cubes.png"
          alt="bg pattern"
          class="w-full h-full object-cover opacity-10 pointer-events-none"
        />
      </div>

      <!-- Card content -->
      <div class="relative z-10">
        <h2 class="text-3xl font-bold mb-2 text-gray-800">
          Create Account
        </h2>
        <p class="text-gray-500 mb-6">
          Join the Voice-to-Intent AI Assistant
        </p>

        <!-- Form -->
        <form onsubmit="handleSignup(event)" class="space-y-5">

          <input
            type="email"
            id="email"
            placeholder="Email"
            required
            class="w-full p-4 rounded-xl border focus:ring-2 focus:ring-green-600 outline-none"
          />

          <input
            type="password"
            id="password"
            placeholder="Password"
            required
            class="w-full p-4 rounded-xl border focus:ring-2 focus:ring-green-600 outline-none"
          />

          <button
            type="submit"
            class="w-full py-3 rounded-xl bg-green-600 text-white font-medium hover:bg-green-700 transition"
          >
            Sign Up
          </button>
        </form>

        <!-- Footer -->
        <p class="text-center text-sm mt-6 text-gray-600">
          Already have an account?
          <a href="login.html" class="text-green-600 font-medium hover:underline">
            Login
          </a>
        </p>
      </div>

    </div>
  </div>

  <script>
    function handleSignup(event) {
      event.preventDefault();

      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      if (!email || !password) {
        alert("Please enter email and password");
        return;
      }

      localStorage.setItem("user", JSON.stringify({ email }));

      alert("Signup Successful!");
      window.location.href = "assistant.html";
    }
  </script>

</body>
</html>
