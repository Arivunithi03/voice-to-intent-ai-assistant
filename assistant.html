<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AI Assistant</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gray-50 flex flex-col items-center p-4">

  <!-- MAIN CARD -->
  <div class="relative w-full max-w-3xl bg-white rounded-3xl shadow-2xl p-8 md:p-12 hover:shadow-3xl transition transform hover:scale-105 flex flex-col">

    <!-- Header -->
    <header class="text-center mb-8">
      <h1 class="text-4xl font-bold mb-2 text-gray-800">AI Assistant</h1>
      <p class="text-gray-500">Voice & Text-based Intelligent Assistant</p>
    </header>

    <!-- Input Section -->
    <div class="relative mb-6">
      <textarea
        id="userText"
        placeholder="Describe your request..."
        class="w-full p-6 rounded-2xl border border-gray-200 focus:ring-2 focus:ring-green-600 outline-none text-gray-800 placeholder-gray-400 resize-none min-h-[140px] bg-white"
      ></textarea>

      <!-- Voice button inside textarea container -->
      <span
        id="voiceBtn"
        title="Click to speak"
        class="absolute top-4 right-4 text-gray-500 hover:text-gray-900 cursor-pointer transition text-xl"
      >🎤</span>
    </div>

    <!-- Buttons -->
    <div class="flex justify-end gap-3 mb-8 flex-wrap">
      <button
        id="refineBtn"
        class="px-6 py-2.5 rounded-xl font-medium bg-white border border-gray-300 hover:bg-gray-100 transition disabled:opacity-50"
      >Refine Intent</button>
      <button
        id="generateBtn"
        class="hidden px-6 py-2.5 rounded-xl font-medium bg-green-600 text-white hover:bg-green-700 transition shadow-sm"
      >Execute Request</button>
    </div>

    <!-- Optimized Prompt -->
    <div id="optimizedSection" class="hidden mb-6">
      <div class="bg-green-50 border border-green-100 rounded-2xl p-5">
        <span class="text-[10px] font-bold text-green-500 uppercase tracking-widest block mb-2">Optimized Directive</span>
        <p id="optimizedPrompt" class="text-gray-700 text-sm italic"></p>
      </div>
    </div>

    <!-- AI Output -->
    <div id="outputSection" class="hidden bg-white rounded-2xl border border-gray-200 p-6 shadow mb-6 max-h-80 overflow-y-auto">
      <span class="text-[10px] font-bold text-gray-400 uppercase tracking-widest block mb-2">System Output</span>
      <div id="aiResponse" class="text-gray-800 text-lg whitespace-pre-wrap"></div>
    </div>

    <!-- History with Logout -->
    <div id="historySection" class="hidden border-t border-gray-200 pt-4 flex flex-col gap-3 max-h-60 overflow-y-auto">
      <div class="flex justify-between items-center mb-2">
        <h3 class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">Recent Activity</h3>
        <button
          id="logoutBtn"
          class="text-red-500 hover:text-red-700 text-sm font-medium transition"
        >Logout</button>
      </div>
      <div id="historyList" class="space-y-2"></div>
    </div>

  </div>

<script>
let optimizedPrompt = null;
let history = JSON.parse(localStorage.getItem("pro_ai_history")) || [];

const userText = document.getElementById("userText");
const refineBtn = document.getElementById("refineBtn");
const generateBtn = document.getElementById("generateBtn");
const optimizedSection = document.getElementById("optimizedSection");
const optimizedPromptEl = document.getElementById("optimizedPrompt");
const outputSection = document.getElementById("outputSection");
const aiResponseEl = document.getElementById("aiResponse");
const historySection = document.getElementById("historySection");
const historyList = document.getElementById("historyList");
const voiceBtn = document.getElementById("voiceBtn");
const logoutBtn = document.getElementById("logoutBtn");

// Render history
function renderHistory() {
  if (!history.length) return;
  historySection.classList.remove("hidden");
  historyList.innerHTML = "";
  history.forEach(item => {
    const div = document.createElement("div");
    div.className = "bg-white border border-gray-200 rounded-xl p-3 text-sm text-gray-500";
    div.innerText = item.output.substring(0, 120) + "...";
    historyList.appendChild(div);
  });
}

// Voice input
voiceBtn.addEventListener("click", () => {
  if (!('SpeechRecognition' in window || 'webkitSpeechRecognition' in window)) {
    alert("Your browser does not support voice input.");
    return;
  }
  const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
  recognition.lang = 'en-US';
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;
  voiceBtn.classList.add("opacity-50");

  recognition.onresult = (event) => {
    userText.value = event.results[0][0].transcript;
    voiceBtn.classList.remove("opacity-50");
  };
  recognition.onerror = () => { voiceBtn.classList.remove("opacity-50"); alert("Voice input failed."); };
  recognition.start();
});

// Refine Intent
refineBtn.addEventListener("click", async () => {
  const text = userText.value.trim();
  if (!text) return;
  refineBtn.innerText = "Analyzing...";
  refineBtn.disabled = true;
  try {
    const res = await fetch("http://127.0.0.1:5000/process", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text })
    });
    const data = await res.json();
    if (!data.optimized_prompt) throw new Error("No optimized prompt");
    optimizedPrompt = data.optimized_prompt;
    optimizedPromptEl.innerText = optimizedPrompt;
    optimizedSection.classList.remove("hidden");
    generateBtn.classList.remove("hidden");
  } catch {
    alert("Refinement failed. Check backend or quota.");
  } finally {
    refineBtn.innerText = "Refine Intent";
    refineBtn.disabled = false;
  }
});

// Generate Response
generateBtn.addEventListener("click", async () => {
  if (!optimizedPrompt) return;
  generateBtn.innerText = "Generating...";
  generateBtn.disabled = true;
  try {
    const res = await fetch("http://127.0.0.1:5000/generate", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ prompt: optimizedPrompt })
    });
    const data = await res.json();
    if (!data.ai_response) throw new Error("No AI response");
    aiResponseEl.innerText = data.ai_response;
    outputSection.classList.remove("hidden");

    history = [{ input: userText.value, output: data.ai_response }, ...history].slice(0, 5);
    localStorage.setItem("pro_ai_history", JSON.stringify(history));
    renderHistory();
  } catch {
    alert("Generation failed. Check backend or quota.");
  } finally {
    generateBtn.innerText = "Execute Request";
    generateBtn.disabled = false;
  }
});

// Logout
logoutBtn.addEventListener("click", () => {
  localStorage.removeItem("user");
  localStorage.removeItem("pro_ai_history");
  window.location.href = "login.html";
});

renderHistory();
</script>

</body>
</html>
